---
name: Backlog Limits Checker
# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check_suse_qa_tools_backlog_limits:
    # prevent running this on forks or any other branches
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'os-autoinst' || github.ref == 'refs/heads/testworkflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: openSUSE/backlogger@3d037a7decf5a6baf4adb762d4bb33058c5f1ee1  # main
        with:
          redmine_api_key: ${{ secrets.REDMINE_API_KEY }}
          webhook_url: ${{ secrets.WEBHOOK_URL }}
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445  # v4.9.0
        with:
          folder: gh-pages
          clean-exclude: pr-preview
