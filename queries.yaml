api: https://progress.opensuse.org/issues.json
web: https://progress.opensuse.org/issues
team: QE Tools
url: https://progress.opensuse.org/projects/qa/wiki/Tools
queries:
  - title: Combined Backlog (dev+infra)
    query: query_id=230
    max: 100
  - title: Dev Backlog
    query: query_id=754
    max: 50
  - title: Infra Backlog
    query: query_id=757
    max: 50
  - title: Next
    query: query_id=794
    max: 64
  - title: Workable Dev Backlog
    query: query_id=1192
    max: 20
    min: 4
  - title: Workable Infra Backlog
    query: query_id=1195
    max: 20
    min: 4
  - title: Exceeding Due Date
    query: query_id=514
    max: 0
  - title: Untriaged QA
    query: query_id=576&project_id=115
    max: 0
  - title: Untriaged Tools Tagged
    query: query_id=481
    max: 0
  - title: SLA immediate (<1 day)
    query: query_id=542
    max: 0
  - title: SLA urgent (<1 week)
    query: query_id=543
    max: 0
  - title: SLA high (<1 month)
    query: query_id=544
    max: 0
  - title: SLA normal (<1 year)
    query: query_id=545
    max: 0
  - title: SLA no imm/urg blocked
    query: query_id=821
    max: 0
  - title: SLO urgent (<1 day)
    query: query_id=824
    max: 0
  - title: SLO high (<1 week)
    query: query_id=827
    max: 0
  - title: SLO normal (<1 month)
    query: query_id=830
    max: 0
  - title: In Progress
    query: query_id=505
    max: 12
    min: 1
    # Redmine redirects unauthenticated requests for this private query to
    # /oic/login (403), so the PR preview build drops it via tools/preview-config
    private: true
  - title: In Feedback
    query: query_id=520
    max: 12
  - title: Closed yesterday
    query: query_id=773
  - title: Stale PRs (>7 days)
    type: github
    repos:
      - os-autoinst/openQA
      - os-autoinst/os-autoinst
      - os-autoinst/os-autoinst-scripts
      - os-autoinst/openqa-logwarn
      - os-autoinst/os-autoinst-distri-openQA
      - os-autoinst/openqa-trigger-from-obs
      - os-autoinst/openqa_review
      - os-autoinst/openqa_bugfetcher
      - os-autoinst/baremetal_support
      - os-autoinst/openqa-mon
      - os-autoinst/os-autoinst-common
      - os-autoinst/openQA-python-client
      - os-autoinst/os-autoinst-wheel-boot
      - os-autoinst/os-autoinst-wheel-launcher
      - os-autoinst/review-assistant
      - os-autoinst/o3-config
      - os-autoinst/os-autoinst-distri-example
      - openSUSE/Mojo-IOLoop-ReadWriteProcess
      - openSUSE/mtui
      - openSUSE/qem-bot
      - openSUSE/backlogger
      - openSUSE/qem-dashboard
      - openSUSE/openSUSE-release-tools
      - openSUSE/git-sha-verify
      - openSUSE/autoupdate-perl
    stale_days: 7
    max: 0
